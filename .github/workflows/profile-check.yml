name: Profile checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: profile-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed 2026-10-08
        with:
          persist-credentials: false
      - name: Check generated artwork
        run: python3 scripts/build_assets.py --check
      - name: Validate profile contracts
        run: python3 -m unittest discover -s tests -v

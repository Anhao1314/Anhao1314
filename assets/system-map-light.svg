<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">System map</title>
  <desc id="desc">Observe, remember, decide, verify, recover. Selected projects are positioned along the loop.</desc>
  <rect width="1200" height="430" rx="24" fill="#F7F7F5"/>
  <rect x="1" y="1" width="1198" height="428" rx="23" fill="none" stroke="#D9D9D5"/>
  <text x="64" y="64" fill="#6E6E73" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" letter-spacing="2">SYSTEM MAP / TRUST ACROSS TIME</text>
  <line x1="64" y1="86" x2="1136" y2="86" stroke="#D9D9D5"/>
  <path d="M150 220 H1050" stroke="#C8C8C4" stroke-width="2"/>
  <path d="M1050 220 l-12 -8 v16 z" fill="#2997FF"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <g>
      <circle cx="150" cy="220" r="32" fill="#FFFFFF" stroke="#BFC0BD"/>
      <text x="150" y="226" text-anchor="middle" fill="#111113" font-size="18" font-weight="700">01</text>
      <text x="150" y="282" text-anchor="middle" fill="#111113" font-size="21" font-weight="700">OBSERVE</text>
      <text x="150" y="310" text-anchor="middle" fill="#6E6E73" font-size="15">signals / events</text>
    </g>
    <g>
      <circle cx="375" cy="220" r="32" fill="#FFFFFF" stroke="#BFC0BD"/>
      <text x="375" y="226" text-anchor="middle" fill="#111113" font-size="18" font-weight="700">02</text>
      <text x="375" y="282" text-anchor="middle" fill="#111113" font-size="21" font-weight="700">REMEMBER</text>
      <text x="375" y="310" text-anchor="middle" fill="#6E6E73" font-size="15">chat-distiller</text>
    </g>
    <g>
      <circle cx="600" cy="220" r="32" fill="#FFFFFF" stroke="#BFC0BD"/>
      <text x="600" y="226" text-anchor="middle" fill="#111113" font-size="18" font-weight="700">03</text>
      <text x="600" y="282" text-anchor="middle" fill="#111113" font-size="21" font-weight="700">DECIDE</text>
      <text x="600" y="310" text-anchor="middle" fill="#6E6E73" font-size="15">RL Sentinel / FlowCredit</text>
    </g>
    <g>
      <circle cx="825" cy="220" r="32" fill="#FFFFFF" stroke="#BFC0BD"/>
      <text x="825" y="226" text-anchor="middle" fill="#111113" font-size="18" font-weight="700">04</text>
      <text x="825" y="282" text-anchor="middle" fill="#111113" font-size="21" font-weight="700">VERIFY</text>
      <text x="825" y="310" text-anchor="middle" fill="#6E6E73" font-size="15">Deep Native / evidence</text>
    </g>
    <g>
      <circle cx="1050" cy="220" r="32" fill="#2997FF"/>
      <text x="1050" y="226" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">05</text>
      <text x="1050" y="282" text-anchor="middle" fill="#111113" font-size="21" font-weight="700">RECOVER</text>
      <text x="1050" y="310" text-anchor="middle" fill="#6E6E73" font-size="15">replay / resume</text>
    </g>
  </g>
  <text x="64" y="382" fill="#6E6E73" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18">Different domains. One recurring engineering question: can the system explain, preserve and resume what happened?</text>
</svg>
<text x="947" y="170" fill="#F0F6FC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700">chat-distiller</text>
<text x="947" y="220" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">DECISION / REPLAY</text>

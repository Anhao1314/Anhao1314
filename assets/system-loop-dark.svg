<text x="58" y="454" fill="#8B949E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17">The system is not finished when it outputs something. It is finished when the state, evidence and recovery path still make sense later.</text>

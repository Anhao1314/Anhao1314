<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
<title id="title">Eason — 生命会自己寻求出路</title>
<desc id="desc">黑白抖动像素风格的深空场景：星空中一枚被左侧光源照亮的月球。</desc>
<defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0H1600" stroke="#fff" stroke-width="1" opacity=".035"/></pattern></defs>
<rect width="1600" height="500" fill="#000"/>
<image x="0" y="0" width="1600" height="410" preserveAspectRatio="none" xlink:href="data:image/png;base64,"/>
<rect width="1600" height="500" fill="url(#scan)"/>
<text x="70" y="48" fill="#9a9a9a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="4">AN EVIDENCE ODYSSEY</text>
<text x="70" y="348" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" letter-spacing="4">生命会自己寻求出路。</text>
<text x="70" y="432" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="2">独立研究者 · AI 与复杂系统</text>
<text x="70" y="468" fill="#8c8c8c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1.4">智能如何研究、判断、行动，并对自己给出的结论负责。</text>
<text x="1120" y="456" fill="#c8c8c8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2">BUILD YOUR OWN EVIDENCE</text>
</svg>
